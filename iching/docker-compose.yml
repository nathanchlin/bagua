version: '3'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    volumes:
      - ./src:/app
    environment:
      - FLASK_ENV=development
      - PORT=5005
    restart: unless-stopped
    networks:
      - iching-net

networks:
  iching-net:
    driver: bridge 