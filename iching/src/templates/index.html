<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周易卦象解析</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .hexagram-symbol {
            font-family: "SimSun", serif;
            font-size: 1.5em;
        }
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .result-section {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">周易卦象解析</h1>
        
        <!-- 问题输入区域 -->
        <div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6 mb-8">
            <form id="questionForm" class="space-y-4">
                <div>
                    <label for="question" class="block text-sm font-medium text-gray-700">请输入你的问题</label>
                    <textarea id="question" name="question" rows="3" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                        placeholder="例如：我的事业发展如何？"></textarea>
                </div>
                <div class="text-right">
                    <button type="submit" 
                        class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        求卦
                    </button>
                </div>
            </form>
        </div>

        <!-- 加载动画 -->
        <div class="loading">
            <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-indigo-500"></div>
        </div>

        <!-- 结果显示区域 -->
        <div id="result" class="result-section max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-semibold mb-4">卦象解析结果</h2>
            
            <!-- 问题 -->
            <div class="mb-6">
                <h3 class="text-lg font-medium text-gray-900">所问问题</h3>
                <p id="questionResult" class="mt-2 text-gray-600"></p>
            </div>

            <!-- 本卦信息 -->
            <div class="mb-6">
                <h3 class="text-lg font-medium text-gray-900">本卦</h3>
                <div class="mt-2 space-y-2">
                    <p><span class="font-medium">卦名：</span><span id="hexagramName"></span></p>
                    <p><span class="font-medium">卦辞：</span><span id="hexagramDescription"></span></p>
                    <p><span class="font-medium">卦义：</span><span id="hexagramMeaning"></span></p>
                </div>
            </div>

            <!-- 上下卦信息 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <h3 class="text-lg font-medium text-gray-900">上卦</h3>
                    <div class="mt-2 space-y-2">
                        <p><span class="font-medium">本卦：</span><span id="upperTrigramName"></span></p>
                        <p><span class="font-medium">性质：</span><span id="upperTrigramNature"></span></p>
                        <p><span class="font-medium">特性：</span><span id="upperTrigramCharacter"></span></p>
                        <p><span class="font-medium">五行：</span><span id="upperTrigramElement"></span></p>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-medium text-gray-900">下卦</h3>
                    <div class="mt-2 space-y-2">
                        <p><span class="font-medium">本卦：</span><span id="lowerTrigramName"></span></p>
                        <p><span class="font-medium">性质：</span><span id="lowerTrigramNature"></span></p>
                        <p><span class="font-medium">特性：</span><span id="lowerTrigramCharacter"></span></p>
                        <p><span class="font-medium">五行：</span><span id="lowerTrigramElement"></span></p>
                    </div>
                </div>
            </div>

            <!-- 爻位信息 -->
            <div class="mb-6">
                <h3 class="text-lg font-medium text-gray-900">爻位</h3>
                <div id="yaoPositions" class="mt-2 space-y-4"></div>
            </div>

            <!-- 变卦信息 -->
            <div id="changedHexagram" class="mb-6" style="display: none;">
                <h3 class="text-lg font-medium text-gray-900">变卦</h3>
                <div class="mt-2 space-y-2">
                    <p><span class="font-medium">卦名：</span><span id="changedHexagramName"></span></p>
                    <p><span class="font-medium">卦辞：</span><span id="changedHexagramDescription"></span></p>
                    <p><span class="font-medium">卦义：</span><span id="changedHexagramMeaning"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('questionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }

            // 显示加载动画
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.result-section').style.display = 'none';

            try {
                const response = await fetch('/cast', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `question=${encodeURIComponent(question)}`
                });

                if (!response.ok) {
                    throw new Error('求卦失败');
                }

                const result = await response.json();
                displayResult(result);
            } catch (error) {
                alert(error.message);
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        });

        function displayResult(result) {
            // 显示结果区域
            document.querySelector('.result-section').style.display = 'block';

            // 更新问题
            document.getElementById('questionResult').textContent = result.question;

            // 更新本卦信息
            document.getElementById('hexagramName').textContent = result.hexagram_name;
            document.getElementById('hexagramDescription').textContent = result.description;
            document.getElementById('hexagramMeaning').textContent = result.meaning;

            // 更新上卦信息
            document.getElementById('upperTrigramName').textContent = result.upper_trigram.name;
            document.getElementById('upperTrigramNature').textContent = result.upper_trigram.nature || '未知';
            document.getElementById('upperTrigramCharacter').textContent = result.upper_trigram.character || '未知';
            document.getElementById('upperTrigramElement').textContent = result.upper_trigram.element || '未知';

            // 更新下卦信息
            document.getElementById('lowerTrigramName').textContent = result.lower_trigram.name;
            document.getElementById('lowerTrigramNature').textContent = result.lower_trigram.nature || '未知';
            document.getElementById('lowerTrigramCharacter').textContent = result.lower_trigram.character || '未知';
            document.getElementById('lowerTrigramElement').textContent = result.lower_trigram.element || '未知';

            // 更新爻位信息
            const yaoPositionsContainer = document.getElementById('yaoPositions');
            yaoPositionsContainer.innerHTML = '';
            result.lines.sort((a, b) => b.position - a.position).forEach(line => {
                const yaoDiv = document.createElement('div');
                yaoDiv.className = 'p-4 bg-gray-50 rounded-lg';
                yaoDiv.innerHTML = `
                    <div class="flex items-center mb-2">
                        <span class="hexagram-symbol mr-2">${line.symbol}</span>
                        <span class="font-medium">第${line.position}爻: ${line.type}</span>
                    </div>
                    <div class="ml-4 space-y-1">
                        <p>${line.yao_text.symbol}: ${line.yao_text.description}</p>
                        <p>含义: ${line.yao_text.meaning}</p>
                        ${line.is_changing ? `<p class="text-indigo-600">变爻: ${line.yao_text.change_meaning}</p>` : ''}
                    </div>
                `;
                yaoPositionsContainer.appendChild(yaoDiv);
            });

            // 更新变卦信息
            const changedHexagramSection = document.getElementById('changedHexagram');
            if (result.has_changes && result.changed_hexagram) {
                changedHexagramSection.style.display = 'block';
                document.getElementById('changedHexagramName').textContent = result.changed_hexagram.name;
                document.getElementById('changedHexagramDescription').textContent = result.changed_hexagram.description;
                document.getElementById('changedHexagramMeaning').textContent = result.changed_hexagram.meaning;
            } else {
                changedHexagramSection.style.display = 'none';
            }
        }
    </script>
</body>
</html>
